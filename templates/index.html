<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Retina Diagnostic Core</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary: #00bcd4; /* Cyan */
            --dark: #121212;
            --panel: #1e1e1e;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Animated Background Particles */
        #canvas-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.3;
        }

        /* --- TECH HEADER --- */
        .header {
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            padding: 20px; text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        .header h1 {
            font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin: 0;
            text-shadow: 0 0 10px var(--primary);
        }

        .container { max-width: 1100px; margin: 40px auto; padding: 20px; }

        /* --- UPLOAD CARD --- */
        .upload-card {
            background: var(--panel); border: 1px solid #333; border-radius: 15px;
            padding: 40px; text-align: center; position: relative;
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.1);
        }
        
        .upload-card::before {
            content: ''; position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 4px; background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        input[type="file"] {
            border: 1px solid #444; background: #222; color: #fff;
            padding: 10px; border-radius: 5px; width: 100%; max-width: 300px;
        }

        .btn {
            background: transparent; color: var(--primary); border: 2px solid var(--primary);
            padding: 12px 30px; font-size: 18px; font-family: 'Courier New', monospace;
            font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }

        /* --- SCANNING VISUALS --- */
        .scan-container {
            position: relative; display: inline-block; margin-top: 20px;
            border: 2px solid #333; border-radius: 10px; overflow: hidden; display: none;
        }
        .scan-img { max-width: 300px; display: block; filter: grayscale(50%); }
        .laser-beam {
            position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: var(--primary); box-shadow: 0 0 15px var(--primary);
            animation: scan 2s infinite ease-in-out; opacity: 0.8;
        }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        /* --- RESULT DASHBOARD --- */
        .result-wrapper {
            display: flex; gap: 30px; margin-top: 50px; flex-wrap: wrap; justify-content: center;
        }
        
        .tech-box {
            background: rgba(30, 30, 30, 0.8); border: 1px solid var(--primary);
            padding: 20px; border-radius: 10px; flex: 1; min-width: 300px; position: relative;
        }

        /* HUD Corners */
        .tech-box::after { content: ''; position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-top: 2px solid var(--primary); border-right: 2px solid var(--primary); }
        .tech-box::before { content: ''; position: absolute; bottom: -5px; left: -5px; width: 20px; height: 20px; border-bottom: 2px solid var(--primary); border-left: 2px solid var(--primary); }

        .status-big {
            font-size: 2rem; font-weight: bold; text-transform: uppercase;
            text-shadow: 0 0 10px currentColor; margin-bottom: 10px;
        }
        
        .advice-list { font-size: 0.9rem; color: #bbb; line-height: 1.6; white-space: pre-line; }

        /* 3D Eye Container */
        #eye-canvas { width: 80px; height: 80px; margin: 0 auto; }
        
        /* Loading Bar */
        #loadingBar { display: none; height: 4px; background: #333; width: 100%; margin-top: 20px; }
        #loadingBar div { height: 100%; background: var(--primary); width: 0%; animation: load 3s ease-in-out infinite; }
        @keyframes load { 0% { width: 0; } 100% { width: 100%; } }
    </style>
</head>
<body>

    <!-- Background Animation Canvas -->
    <canvas id="canvas-bg"></canvas>

    <div class="header">
        <div id="eye-canvas"></div>
        <h1>AI Retina Diagnostic Core</h1>
        <p style="color: var(--primary); font-size: 0.9rem; letter-spacing: 3px;">DENSENET-121 SYSTEM ONLINE</p>
    </div>

    <div class="container">
        
        <!-- Upload Card -->
        <div class="upload-card">
            <h2 style="color: #fff;"><i class="fas fa-microchip"></i> Upload Fundus Scan</h2>
            
            <form action="/" method="post" enctype="multipart/form-data" onsubmit="startScan()">
                <input type="file" name="file" accept="image/*" required id="fileInput" onchange="previewImage(event)">
                <br>
                
                <!-- Scanned Preview -->
                <div class="scan-container" id="scanPreview">
                    <img id="preview" class="scan-img" src="" alt="Eye Preview">
                    <div class="laser-beam"></div>
                </div>

                <div id="loadingBar"><div></div></div>
                
                <button type="submit" class="btn">INITIALIZE DIAGNOSIS</button>
            </form>
        </div>

        <!-- Real Results Section (Populated by Python) -->
        {% if data %}
        <div class="result-wrapper">
            
            <!-- LEFT: Image & Analysis -->
            <div class="tech-box" style="text-align: center;">
                <h3 style="color: var(--primary); border-bottom: 1px solid #444; padding-bottom: 10px;">
                    <i class="fas fa-eye"></i> Target Analysis
                </h3>
                <img src="{{ data.image_path }}" style="width: 100%; border-radius: 5px; border: 1px solid var(--primary);">
                
                <br><br>
                <!-- Probability Chart -->
                <canvas id="riskChart"></canvas>
            </div>

            <!-- RIGHT: Report & Advice -->
            <div class="tech-box">
                <h3 style="color: var(--primary); border-bottom: 1px solid #444; padding-bottom: 10px;">
                    <i class="fas fa-notes-medical"></i> Diagnostic Report
                </h3>
                
                <div class="status-big" style="color: {{ data.color }};">
                    {{ data.result }}
                </div>

                <p style="color: #aaa;">AI Confidence Level: <strong style="color: #fff;">{{ data.confidence }}%</strong></p>

                <div style="margin-top: 20px; background: #222; padding: 15px; border-left: 3px solid {{ data.color }}">
                    <strong style="color: #fff;">Protocol / Advice:</strong>
                    <p class="advice-list">{{ data.advice }}</p>
                </div>

                <div style="margin-top: 15px; background: #222; padding: 15px; border-left: 3px solid #ff9800;">
                    <strong style="color: #fff;">Home Care Protocol:</strong>
                    <p class="advice-list">{{ data.home_care }}</p>
                </div>
            </div>

        </div>

        <!-- Hidden Data for JS Chart -->
        <input type="hidden" id="confValue" value="{{ data.confidence }}">
        <input type="hidden" id="resValue" value="{{ data.result }}">
        {% endif %}

    </div>

    <!-- SCRIPTS -->
    <script>
        // 1. Preview Image
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                document.getElementById('preview').src = reader.result;
                document.getElementById('scanPreview').style.display = 'inline-block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // 2. Loading Animation
        function startScan() {
            document.getElementById('loadingBar').style.display = 'block';
            document.querySelector('.btn').innerText = "PROCESSING...";
        }

        // 3. Three.js Wireframe Eye
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(80, 80);
        document.getElementById('eye-canvas').appendChild(renderer.domElement);
        
        const geometry = new THREE.IcosahedronGeometry(1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0x00bcd4, wireframe: true });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        camera.position.z = 2;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x += 0.01; sphere.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // 4. Chart.js (Only if results exist)
        const confInput = document.getElementById('confValue');
        if (confInput) {
            const confidence = parseFloat(confInput.value);
            const isGlaucoma = document.getElementById('resValue').value.includes("Glaucoma");
            
            // Calculate Risk vs Healthy
            let risk = isGlaucoma ? confidence : (100 - confidence);
            let healthy = 100 - risk;

            const ctx = document.getElementById('riskChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Risk', 'Healthy'],
                    datasets: [{
                        data: [risk, healthy],
                        backgroundColor: ['#d32f2f', '#388e3c'],
                        borderColor: '#1e1e1e',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
